name: HR Analytics CI/CD Pipeline

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main" ]

# Variables d'environnement globales (secrets GitHub)
env:
  POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
  POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
  POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
  DATABASE_URL: ${{ secrets.DATABASE_URL }}

jobs:
  # ===========================================
  # JOB 1: Tests et Qualité du code
  # ===========================================
  test:
    runs-on: ubuntu-latest
    environment: test

    steps:
    # 1. Récupération du code
    - name: Checkout code
      uses: actions/checkout@v4

    # 2. Installation de Python
    - name: Set up Python 3.9
      uses: actions/setup-python@v5
      with:
        python-version: "3.9"
        cache: 'pip'

    # 3. Installation des dépendances
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .[dev]

    # 4. Linting (Qualité du code)
    - name: Lint with flake8
      run: |
        flake8 src tests --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 src tests --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    # 5. Entraînement du modèle (nécessaire pour les tests de prédiction)
    - name: Train Model
      run: |
        python src/train.py

    # 6. Tests avec couverture de code
    - name: Run Tests with Coverage
      run: |
        pytest tests/ -v --cov=src --cov-report=xml --cov-report=html --cov-fail-under=80

    # 7. Upload du rapport de couverture
    - name: Upload Coverage Report
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: htmlcov/

  # ===========================================
  # JOB 2: Build et validation (staging)
  # ===========================================
  build:
    runs-on: ubuntu-latest
    needs: test
    environment: staging
    if: github.ref == 'refs/heads/main'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python 3.9
      uses: actions/setup-python@v5
      with:
        python-version: "3.9"
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .[dev]

    # Entraînement du modèle
    - name: Train Model
      run: |
        python src/train.py

    # Upload du modèle entraîné
    - name: Upload Model Artifact
      uses: actions/upload-artifact@v4
      with:
        name: trained-model
        path: model_hr.pkl

  # ===========================================
  # JOB 3: Déploiement (production)
  # ===========================================
  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment: production
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Download Model Artifact
      uses: actions/download-artifact@v4
      with:
        name: trained-model
        path: .

    - name: Deploy to Render
      run: |
        echo "Deploiement en production sur Render..."
        curl -s "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
        echo "Deploiement declenche avec succes."